topics:
  pointcloud: "/ouster/points"
  imu: "/ouster/imu"

calibration: # T_IMU_LIDAR (LiDAR -> IMU)
  translation: [-0.00625, 0.011775, -0.007645]
  rotation: [1, 0, 0,
             0, 1, 0,
             0, 0, 1]

lidar:
  min_range_m: 0.5 # Exclude points closer than this range [m]
  max_range_m: 100 # Exclude points farther than this range [m]

intensity: # Ouster OS0-128 spherical normalization geometry
  image_width: 1024 # Spherical normalization image width [px]
  image_height: 128 # Spherical normalization image height [px]
  vertical_fov_deg: 90 # Vertical field of view covered by the normalization image [deg]
  brightness_window_width: 41 # Sparse-safe local brightness window, must be odd [px]
  brightness_window_height: 7 # Sparse-safe local brightness window, must be odd [px]
  output_scale: 140 # Scale s in Eq. (2), output is clamped to [0, 255]
