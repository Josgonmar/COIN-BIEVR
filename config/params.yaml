map:
  pixel_size_m: 0.05 # Pixel side length [m]
  voxel_size_m: 0.5 # Voxel side length [m]
  normal_tolerance_deg: 3 # Normal change threshold to trigger reprojection of voxel image [°]
  smooth: True # Apply smoothing to the voxel image
  weighted: True # Weighted pixel update
  max_size: 1500000 # Maximum number of voxels to keep in the map
  frame: "odom"

preprocess:
  downsample_resolution_m: 0.1 # Downsample points to this resolution [m]. In case of informed sampling, this
  # corresponds to the high resolution voxels
  informed_sampling: True
  intensity_voxels: 100 # Number of strongest complementary intensity voxels to use
  intensity_downsample_resolution_m: 0.1 # Photometric sampling resolution inside selected voxels [m]

optimization:
  huber_delta: 0.1 # Huber norm threshold
  adaptive_huber: True # Adapt separate geometric/photometric Huber thresholds with PKO
  pko_min_delta_factor: 0.01 # Minimum PKO delta relative to huber_delta
  pko_max_delta_factor: 100.0 # Initial/max PKO delta relative to huber_delta
  pko_num_candidates: 25 # Candidate thresholds searched by PKO
  pko_truncation_factor: 100.0 # Finite Huber-PKO integration range relative to huber_delta
  pko_gmm_components: 2 # Components used to model each residual distribution
  pko_gmm_sample_size: 100 # Maximum samples used by the GMM fit
  pko_update_interval: 1 # Re-estimate PKO after this many accepted LM steps
  photometric_weight: 0.00095 # Lambda in the joint geometric-photometric objective

imu:
    window_s: 10 # Time window for the inertial optimization [s]
    t_init: 1.0 # Time to initialize bias and gravity [s]
    frame: "imu"

debug:
  publish_all_clouds: False # Publish all clouds (fine, coarse, deskewed)
  timing: False
  log: False
  dashboard: True # Fancy live status print (position, biases, timing, ...)
  dashboard_ascii_path: "" # ASCII art for the dashboard. Empty = coin_bievr_ascii.txt next to the config.
  trajectory_path: "" # Path to save trajectory. If empty, logs will not be saved.

max_num_threads: 0 # 0 = automatic, >0 = number of threads to use for parallel processing
